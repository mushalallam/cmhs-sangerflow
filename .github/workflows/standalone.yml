name: Standalone builds

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: macOS-Apple-Silicon
            executable: dist/sangerflow
            format: zip
          - runner: macos-15-intel
            label: macOS-Intel
            executable: dist/sangerflow
            format: zip
          - runner: ubuntu-22.04
            label: Linux-x86_64
            executable: dist/sangerflow
            format: tar.gz
          - runner: windows-2025
            label: Windows-x86_64
            executable: dist/sangerflow.exe
            format: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[standalone]'
      - name: Build one-file executable
        run: pyinstaller --clean --noconfirm --onefile --name sangerflow packaging/sangerflow_entry.py
      - name: Test standalone executable
        run: python packaging/smoke_standalone.py "${{ matrix.executable }}" --version 0.2.1
      - name: Package download and checksum
        run: >-
          python packaging/package_standalone.py
          --binary "${{ matrix.executable }}"
          --platform-label "${{ matrix.label }}"
          --version 0.2.1
          --format "${{ matrix.format }}"
      - name: Retain workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CMHS-SangerFlow-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
      - name: Attach files to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" release-assets/* --clobber
