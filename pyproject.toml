[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sangerflow"
version = "0.3.0"
description = "CMHS pipeline for auditable Sanger QC, consensus, and variant reporting"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mushal Allam"}]
keywords = ["sanger", "sequencing", "chromatogram", "bioinformatics", "AB1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["biopython>=1.83,<2", "flask>=3.1,<4"]

[project.urls]
Homepage = "https://github.com/mushalallam/cmhs-sangerflow"
Issues = "https://github.com/mushalallam/cmhs-sangerflow/issues"
Source = "https://github.com/mushalallam/cmhs-sangerflow"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]
standalone = ["pyinstaller==6.22.2"]

[project.scripts]
sangerflow = "sangerflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
